<svg width="40" height="40" viewBox="0 0 200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle outline -->
  <circle cx="100" cy="110" r="95" fill="none" stroke="#CCCCCC" stroke-width="2" opacity="0.6"/>
  
  <!-- Head Profile -->
  <path d="M 70 60 Q 60 80 60 110 Q 60 140 70 160 L 85 180 Q 95 185 105 185 Q 115 185 125 180 L 140 160 Q 150 140 150 110 Q 150 80 140 60 Q 130 50 115 50 Q 105 48 100 48 Q 95 48 85 50 Q 70 50 70 60 Z" fill="#999999" opacity="0.85"/>
  
  <!-- Head outline/profile line -->
  <path d="M 70 60 Q 60 80 60 110 Q 60 140 70 160 L 85 180" fill="none" stroke="#AAAAAA" stroke-width="1.5" opacity="0.5"/>
  <path d="M 140 60 Q 150 80 150 110 Q 150 140 140 160 L 125 180" fill="none" stroke="#AAAAAA" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Brain area background (lighter circle) -->
  <circle cx="100" cy="90" r="50" fill="white" opacity="0.15"/>
  
  <!-- Plant/Leaf Design in Brain Area -->
  <g transform="translate(100, 85)">
    <!-- Main central stem -->
    <path d="M 0 20 Q -3 10 -5 0" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 20 Q 3 10 5 0" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Top left leaf -->
    <ellipse cx="-18" cy="-5" rx="11" ry="18" fill="white" transform="rotate(-40 -18 -5)"/>
    
    <!-- Top right leaf -->
    <ellipse cx="18" cy="-5" rx="11" ry="18" fill="white" transform="rotate(40 18 -5)"/>
    
    <!-- Middle left leaf -->
    <ellipse cx="-14" cy="8" rx="10" ry="15" fill="white" transform="rotate(-30 -14 8)"/>
    
    <!-- Middle right leaf -->
    <ellipse cx="14" cy="8" rx="10" ry="15" fill="white" transform="rotate(30 14 8)"/>
    
    <!-- Bottom left leaf -->
    <ellipse cx="-10" cy="18" rx="9" ry="13" fill="white" transform="rotate(-20 -10 18)"/>
    
    <!-- Bottom right leaf -->
    <ellipse cx="10" cy="18" rx="9" ry="13" fill="white" transform="rotate(20 10 18)"/>
  </g>
  
  <!-- Neck area -->
  <ellipse cx="100" cy="195" rx="18" ry="20" fill="#999999" opacity="0.6"/>
  
  <!-- Shoulder hints -->
  <path d="M 82 210 Q 70 220 70 235" fill="none" stroke="#AAAAAA" stroke-width="1.5" opacity="0.4"/>
  <path d="M 118 210 Q 130 220 130 235" fill="none" stroke="#AAAAAA" stroke-width="1.5" opacity="0.4"/>
</svg>